{% import "macros/fields.html" as ui %}

<div class="public-form p-6 rounded-xl shadow-inner min-h-[300px]">
  {% if display_name %}
    <h2 class="text-2xl font-bold text-center mb-1">{{ display_name }}</h2>
  {% endif %}
  {% if description %}
    <div class="text-center font-medium text-sm mb-6">{{ description | safe_html }}</div>
  {% endif %}

  <div class="space-y-4 max-w-lg mx-auto">
    {% for field in fields %}
      {{ ui.render_field(field) }}
    {% endfor %}
  </div>
</div>
